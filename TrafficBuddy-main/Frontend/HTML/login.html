<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrafficBuddy – Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚦</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation" id="bgAnimation"></div>

    <!-- Auth Container -->
    <div class="auth-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-icon">🚦</div>
            <h1 class="app-title">TrafficBuddy</h1>
            <p class="app-subtitle">Smart Route Navigation System</p>
        </div>

        <!-- Tab Switcher -->
        <div class="tab-switcher">
            <button class="tab-btn active" onclick="switchTab('login')" type="button">Login</button>
            <button class="tab-btn" onclick="switchTab('signup')" type="button">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div class="form-container active" id="loginForm">
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="loginUser">User ID / Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" class="input-field" id="loginUser" placeholder="Enter your user ID or email" autocomplete="username" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="input-field" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>
                    <div class="error-message" id="loginError">Invalid credentials. Please try again.</div>
                </div>

                <button type="submit" class="btn-submit" id="loginBtn">
                    <span id="loginBtnText">Login to Dashboard</span>
                </button>

                <div class="extra-links">
                    <span class="muted">Exhibition demo login: <strong>demo</strong> / <strong>demo123</strong></span>
                </div>
                <div class="extra-links">
                    <a href="#" onclick="showComingSoon(event)">Forgot Password?</a>
                </div>
            </form>
        </div>

        <!-- Signup Form -->
        <div class="form-container" id="signupForm">
            <form onsubmit="handleSignup(event)">
                <div class="input-group">
                    <label for="signupName">Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" class="input-field" id="signupName" placeholder="Enter your full name" autocomplete="name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">📧</span>
                        <input type="email" class="input-field" id="signupEmail" placeholder="Enter your email" autocomplete="email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="input-field" id="signupPassword" placeholder="Create a password" autocomplete="new-password" required minlength="6">
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔐</span>
                        <input type="password" class="input-field" id="signupConfirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>
                    </div>
                    <div class="error-message" id="signupError">Passwords do not match.</div>
                </div>

                <button type="submit" class="btn-submit" id="signupBtn">
                    <span id="signupBtnText">Create Account</span>
                </button>

                <div class="extra-links">
                    <span class="muted">Sign up isn't available in this demo build — use the demo login above.</span>
                </div>
            </form>
        </div>
    </div>

    <script src="../JS/login.js"></script>
</body>
</html>
